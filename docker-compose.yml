# Syntech Smart Farm — production
#
#   docker compose build      # build image (ต้องมี packages/web/.env สำหรับ VITE_*)
#   docker compose up -d      # รัน · เปิดที่ http://localhost:8080
#
# ปรับพอร์ต/backend: ตั้ง WEB_PORT / BACKEND_ORIGIN ผ่าน shell env หรือไฟล์ .env ที่ราก compose

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: syntech-smart-farm-web:latest
    container_name: syntech-web
    environment:
      # ปลายทางที่ nginx reverse-proxy `/hs-proxy` ไปหา (คำสั่งจริง) — เลี่ยง CORS
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-https://backend-prod.synexta.ai}
      # WebSocket ต่อ backend ตรง ไม่ผ่าน proxy → CSP ต้องอนุญาตแยก
      BACKEND_WS_ORIGIN: ${BACKEND_WS_ORIGIN:-wss://backend-prod.synexta.ai}
      # ตั้งให้ตรงกับ VITE_SUPABASE_URL ของ build นั้น ไม่งั้น CSP จะบล็อกหน้าล็อกอิน
      SUPABASE_ORIGIN: ${SUPABASE_ORIGIN:-https://*.supabase.co}
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # 🔴 endpoint/พอร์ตแก้ให้ตรงคอนเทนเนอร์นี้ — เว็บเป็น nginx เสิร์ฟ SPA บน :80 (ไม่ใช่ backend :3000)
      #    จึง check `/healthz` ที่ nginx คืน 200 (ดู deploy/nginx.conf.template) · 127.0.0.1 บังคับ IPv4
      #    (busybox/alpine resolve localhost เป็น ::1 ก่อน แต่ nginx `listen 80;` bind แค่ IPv4)
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
